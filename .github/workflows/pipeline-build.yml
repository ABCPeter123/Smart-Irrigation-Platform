name: Python irrigation pipeline verification

on:
  push:
    branches: [main, feature/pipeline-api-hosting]
    paths:
      - "backend/data_pipeline/**"
      - ".github/workflows/pipeline-build.yml"
  pull_request:
    paths:
      - "backend/data_pipeline/**"
      - ".github/workflows/pipeline-build.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: irrigation_ci
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pipeline -d irrigation_ci"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    env:
      TEST_DATABASE_URL: postgresql://pipeline:test_only_password@localhost:5432/irrigation_ci
    defaults:
      run:
        working-directory: backend/data_pipeline
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pipeline dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q pipeline run_pipeline.py
      - name: Exercise SQL migrations and idempotent recommendations
        run: python -m unittest discover -s tests -v
