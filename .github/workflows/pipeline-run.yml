name: Run irrigation ETL (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irrigation-etl
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: irrigation-pipeline
    defaults:
      run:
        working-directory: backend/data_pipeline
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pipeline requirements
        run: python -m pip install -r requirements.txt
      - name: Confirm database configuration
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure PIPELINE_DATABASE_URL in the protected irrigation-pipeline GitHub environment."
            exit 1
          fi
      - name: Execute ETL
        env:
          DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
        run: python run_pipeline.py
